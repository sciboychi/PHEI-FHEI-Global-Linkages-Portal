
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>PHEI-FHEI Global Linkages Portal | CHED</title>
  <meta name="description" content="A high-performance directory for international partnerships in Philippine Higher Education, featuring the ACHIEVE filtering system and secure administrative access.">
  <meta property="og:title" content="PHEI-FHEI Global Linkages Portal | CHED">
  <meta property="og:description" content="A high-performance directory for international partnerships in Philippine Higher Education, featuring the ACHIEVE filtering system and secure administrative access.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fcfdfe;
      overflow-x: hidden;
    }
    .ched-blue { background-color: #0032a0; }
    .ched-red { background-color: #c8102e; }
    .ched-yellow { background-color: #fdda25; }
    
    * {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glass-nav {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    
    @keyframes progress {
      0% { transform: scaleX(0); }
      50% { transform: scaleX(0.7); }
      100% { transform: scaleX(1); }
    }
    .animate-progress {
      animation: progress 2s infinite ease-in-out;
    }

    @keyframes pop-in {
      0% { transform: translateY(10px) scale(0.95); opacity: 0; }
      70% { transform: translateY(-2px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-pop-in {
      animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes slide-reveal {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-reveal {
      animation: slide-reveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes bounce-x {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-4px); }
    }
    .group:hover .animate-bounce-left {
      animation: bounce-x 1s infinite;
    }
    
    @keyframes bounce-x-right {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }
    .group:hover .animate-bounce-right {
      animation: bounce-x-right 1s infinite;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-shadow-none { box-shadow: none !important; border: 1px solid #eee !important; }
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
